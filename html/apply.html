<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apply Job - JobConnect</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            Job<span>Connect</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="jobs.html">
                    Jobs
                </a>
            </li>

            <li>
                <a href="favorites.html">
                    Favorites ❤️
                </a>
            </li>

        </ul>

    </nav>

</header>


<section class="apply-section">

    <h1>Job Application</h1>

    <form id="applicationForm">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >


        <label>Skills</label>

        <textarea
            id="skills"
            placeholder="Example: Python, JavaScript, SQL"
            required
        ></textarea>


        <label>Resume</label>

        <input
            type="file"
            id="resume"
            accept=".pdf,.doc,.docx"
            required
        >


        <button type="submit">
            Submit Application
        </button>

    </form>

</section>


<footer>

    <p>
        © 2026 JobConnect. All Rights Reserved.
    </p>

</footer>


<script src="/js/apply.js"></script>

</body>
</html>
